[project]
name = "mini-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed Belaaj", email = "ahmed-bellaaj@outlook.com"}
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "async-pymongo>=0.1.12",
    "fastapi>=0.136.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "mypy>=2.3.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.9",
    "types-aiofiles>=25.1.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/main.py",
    "src/routes",
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""


[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
